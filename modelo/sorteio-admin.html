<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscrições do sorteio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 28px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #e5e7eb; border-radius: 10px; outline: none; }
  input:focus { border-color: #111827; }
  button { width: 100%; margin-top: 14px; padding: 13px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; color: #fff; background: #111827; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .perigo { background: #b91c1c; }
  .total { font-size: 15px; margin-top: 14px; font-weight: 600; }
  .msg { margin-top: 14px; font-size: 14px; display: none; }
  .msg.mostrar { display: block; }
  .msg.erro { color: #b91c1c; }
  .msg.ok { color: #047857; }
  hr { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0 8px; }
  .escondido { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Inscrições do sorteio</h1>
    <p>Área do dono do site. Digite a senha para baixar a planilha com as inscrições ou apagar tudo depois do resultado.</p>

    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button id="entrar">Entrar</button>

    <div id="area" class="escondido">
      <div class="total" id="total"></div>
      <button id="baixar">Baixar planilha (Excel)</button>
      <hr>
      <label for="confirmacao">Apagar todas as inscrições (depois do resultado)</label>
      <input id="confirmacao" placeholder="Digite APAGAR para confirmar" autocomplete="off">
      <button id="apagar" class="perigo">Apagar tudo</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
<script src="sorteio-admin.js"></script>
</body>
</html>
