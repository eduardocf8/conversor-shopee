<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRICAO}}">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRICAO}}">
<meta property="og:image" content="foto.jpg">
<meta name="theme-color" content="{{COR_PRINCIPAL}}">
<style>
  :root {
    --laranja: {{COR_PRINCIPAL}};
    --laranja-escuro: {{COR_ESCURA}};
    --fundo: {{COR_FUNDO}};
    --texto: #2b2b2b;
    --cinza: #6b7280;
    --borda: color-mix(in srgb, var(--laranja) 18%, #fff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    border-radius: 20px;
    padding: 32px 26px;
    box-shadow: 0 10px 40px color-mix(in srgb, var(--laranja) 12%, transparent);
    text-align: center;
  }
  .foto {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 14px;
    border: 3px solid var(--laranja);
    display: block;
  }
  h1 {
    font-size: 20px;
    color: var(--laranja);
    margin-bottom: 4px;
  }
  .sub {
    font-size: 14px;
    color: var(--cinza);
    margin-bottom: 22px;
  }
  .label {
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
  }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 2px solid var(--borda);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--laranja); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--laranja);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--laranja-escuro); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .resultado {
    margin-top: 22px;
    padding: 18px;
    background: var(--fundo);
    border-radius: 12px;
    display: none;
  }
  .resultado.mostrar { display: block; }
  .resultado .link-box {
    word-break: break-all;
    font-size: 14px;
    color: var(--laranja-escuro);
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    border: 1px dashed var(--laranja);
    margin-bottom: 12px;
  }
  .acoes { display: flex; gap: 10px; }
  .acoes a, .acoes .copiar {
    flex: 1;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
  }
  .acoes a { background: var(--laranja); color: #fff; }
  .acoes .copiar { background: #fff; color: var(--laranja); border: 2px solid var(--laranja); }
  .erro {
    margin-top: 16px;
    color: #b91c1c;
    font-size: 14px;
    display: none;
  }
  .erro.mostrar { display: block; }
  .passos {
    margin-top: 26px;
    text-align: left;
    font-size: 14px;
    color: var(--cinza);
    line-height: 1.9;
  }
  .passos h3 { font-size: 15px; color: var(--texto); margin-bottom: 8px; }

  /* ===== ANIMAÇÕES / MOVIMENTO ===== */

  /* Botão "respirando" (pulsando) + brilho passando por cima */
  @keyframes pulsar {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 color-mix(in srgb, var(--laranja) 50%, transparent); }
    70%  { transform: scale(1.03); box-shadow: 0 0 0 14px color-mix(in srgb, var(--laranja) 0%, transparent); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 color-mix(in srgb, var(--laranja) 0%, transparent); }
  }
  @keyframes brilho {
    0%   { left: -60%; }
    100% { left: 130%; }
  }
  button#btn {
    position: relative;
    overflow: hidden;
    animation: pulsar 1.8s infinite;
  }
  /* faixa de brilho que atravessa o botão */
  button#btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: skewX(-20deg);
    animation: brilho 2.5s infinite;
  }
  /* enquanto estiver gerando, para de pulsar pra não confundir */
  button#btn:disabled { animation: none; }
  button#btn:disabled::after { display: none; }

  /* Faixa de urgência (fogo) */
  .urgencia {
    background: color-mix(in srgb, var(--laranja) 8%, #fff);
    color: var(--laranja-escuro);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    animation: tremer 3s infinite;
  }
  @keyframes tremer {
    0%, 92%, 100% { transform: translateX(0); }
    94% { transform: translateX(-2px); }
    96% { transform: translateX(2px); }
    98% { transform: translateX(-1px); }
  }

</style>
</head>
<body>
  <div class="card">
    <img src="foto.jpg" alt="{{NOME}}" class="foto">
    <h1>{{TITULO_LINHAS}}</h1>
    <p class="sub">{{SUBTITULO}}</p>
<!--FAIXA_CUPONS-->
    <div class="urgencia">{{TEXTO_FAIXA_CUPONS}}</div>
<!--/FAIXA_CUPONS-->

    <label class="label" for="link">Link do produto na Shopee</label>
    <input type="text" id="link" placeholder="Cole aqui o link do produto...">
    <button id="btn">{{TEXTO_BOTAO}}</button>

    <div class="erro" id="erro"></div>

    <div class="resultado" id="resultado">
      <div class="link-box" id="linkBox"></div>
      <div class="acoes">
        <a id="abrir" href="#" target="_blank" rel="noopener noreferrer">Abrir produto</a>
        <span class="copiar" id="copiar">Copiar link</span>
      </div>
    </div>

    <div class="passos">
      <h3>📋 Como funciona?</h3>
      1️⃣ Copie o link do produto na Shopee<br>
      2️⃣ Cole o link no campo acima<br>
      3️⃣ Clique em "Gerar link com desconto"<br>
      4️⃣ Abra o produto — o cupom aparece no carrinho
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
