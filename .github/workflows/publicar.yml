name: Publicar site de cliente

# Rodar em: aba Actions -> "Publicar site de cliente" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Nome da pasta do cliente em clientes/ (ex: vegrassi)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publicar-${{ inputs.cliente }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLIENTE: ${{ inputs.cliente }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Monta o site
        run: node scripts/montar.js "$CLIENTE" --publicar
      - name: Publica na Cloudflare
        env:
          TOKEN_PESSOAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_CLIENTES: ${{ secrets.CLOUDFLARE_API_TOKEN_CLIENTES }}
        run: |
          cd "dist/$CLIENTE"
          # Cada conta Cloudflare tem o seu token (ver GUIA.md, seção 1)
          CONTA=$(node -p 'require("./publicar.json").conta')
          if [ "$CONTA" = "pessoal" ]; then
            export CLOUDFLARE_API_TOKEN="$TOKEN_PESSOAL"; SECRET_ESPERADO=CLOUDFLARE_API_TOKEN
          else
            export CLOUDFLARE_API_TOKEN="$TOKEN_CLIENTES"; SECRET_ESPERADO=CLOUDFLARE_API_TOKEN_CLIENTES
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret $SECRET_ESPERADO no GitHub (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          TIPO=$(node -p 'require("./publicar.json").tipo')
          NOME=$(node -p 'require("./publicar.json").nome')
          export CLOUDFLARE_ACCOUNT_ID=$(node -p 'require("./publicar.json").account_id')
          # Sorteio ligado: cria o banco D1 na primeira vez (precisa da permissão "D1: Edit" no token)
          BANCO=$(node -p 'require("./publicar.json").sorteio_banco || ""')
          if [ -n "$BANCO" ]; then
            ID_BANCO=$(npx wrangler d1 list --json | node ../../scripts/banco-sorteio.js id "$BANCO")
            if [ -z "$ID_BANCO" ]; then
              npx wrangler d1 create "$BANCO" --location enam
              ID_BANCO=$(npx wrangler d1 list --json | node ../../scripts/banco-sorteio.js id "$BANCO")
            fi
            echo "Banco do sorteio: $BANCO"
          fi
          if [ "$TIPO" = "pages" ]; then
            # Cria o projeto Pages na primeira publicação
            if ! npx wrangler pages project list --json | node ../../scripts/projeto-pages.js "$NOME" > /dev/null; then
              npx wrangler pages project create "$NOME" --production-branch main
            fi
            if [ -n "$BANCO" ]; then
              # Liga o banco ao projeto como SORTEIO_DB (o arquivo de configuração não basta no Pages)
              node ../../scripts/banco-sorteio.js corpo-pages "$ID_BANCO" | curl -fsS -o /dev/null -X PATCH \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$NOME" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @-
              echo "Banco ligado ao site como SORTEIO_DB."
              # Diagnóstico: o que o projeto tem gravado (só nomes e ids, nada de valor secreto)
              curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$NOME" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e '
                  const p = JSON.parse(require("fs").readFileSync(0, "utf8")).result;
                  for (const amb of ["production", "preview"]) {
                    const c = p.deployment_configs[amb] || {};
                    console.log(amb, "d1:", JSON.stringify(c.d1_databases || null), "config_hash:", Boolean(c.wrangler_config_hash), "vars:", Object.keys(c.env_vars || {}).join(","));
                  }
            fi
            npx wrangler pages deploy --project-name "$NOME" --branch main --commit-dirty=true
            echo "Endereço do site: https://$(npx wrangler pages project list --json | node ../../scripts/projeto-pages.js "$NOME" | cut -d, -f1)"
          else
            if [ -n "$BANCO" ]; then node ../../scripts/banco-sorteio.js ligar wrangler.jsonc "$BANCO" "$ID_BANCO"; fi
            npx wrangler deploy --config wrangler.jsonc
          fi
